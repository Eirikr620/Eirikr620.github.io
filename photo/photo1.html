<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHOTO | Jonghyeok Hong</title>
  <link rel="stylesheet" href="photo1.css" />
  <script src="photo1.photos.js" defer></script>
  <script src="photo1.js" defer></script>
</head>

<body>
  <!--
    사진 관리: photo1.photos.js의 PHOTO_LIST만 수정하세요.
    • 추가: images 폴더에 파일을 넣고 목록에 한 줄 추가
    • 제거: 목록에서 해당 줄 삭제 (원본 파일은 그대로 유지)
    • 순서: 목록은 오래된 → 최신 순서, 화면에는 최신 사진부터 표시
    • 디자인: photo1.css 상단의 열 수, 간격, 창 너비 설정
    • 동작: photo1.js에서 갤러리, 확대 보기, 최소화, 드래그 관리
  -->
  <div class="menu-container" id="draggable-menu">
    <div class="win98__titlebar" id="retroBar">
      <div class="menu-title">Menu</div>

      <div class="win98__controls">
        <button type="button" data-minimize class="btn-98" id="menuMin" title="Minimize"
                aria-label="Minimize" aria-controls="menuBody" aria-expanded="true">
          <svg class="ico" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1" y="7" width="8" height="1.6" fill="#5b3d84"/>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="win98__body" id="menuBody">
      <ul class="menu-list">
        <li><a href="../index.html">TOP</a></li>
        <li><a href="../profile/profile.html">PROFILE</a></li>
        <li><a href="../blgo/blog1.html">BLOG</a></li>
        <li><a href="../project/projects.html">PROJECTS</a></li>
        <li><a href="photo1.html">PHOTO</a></li>
      </ul>
    </div>
  </div>

  <main aria-label="사진 갤러리">
    <div class="content-window" id="photoWin">
      <div class="win98__titlebar">
        <div class="menu-title">PHOTO</div>

        <div class="win98__controls">
          <button type="button" data-minimize class="btn-98" id="photoMin" title="Minimize"
                  aria-label="Minimize" aria-controls="photoBody" aria-expanded="true">
            <svg class="ico" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1" y="7" width="8" height="1.6" fill="#5b3d84"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="win98__body" id="photoBody">
        <div id="gallery" class="gallery" aria-live="polite"></div>
        <noscript>사진 갤러리를 보려면 JavaScript를 활성화해 주세요.</noscript>
      </div>
    </div>
  </main>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="원본 이미지 보기">
    <div class="lightbox__inner">
      <img class="lightbox__img" id="lightboxImg" alt="" />
      <button type="button" class="lightbox__close" id="lightboxClose" aria-label="닫기(ESC)">✕</button>
    </div>
  </div>


</body>
</html>
