<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonghyeok Hong</title>
  <link rel="stylesheet" href="index.css" />
  <script src="index.js" defer></script>
</head>
<body>
  <!--
    수정 안내
    • 페이지 타이틀: 아래 page-title의 텍스트
    • 타이틀 위치·크기와 메뉴 간격: index.css 상단의 배치 설정
    • 메뉴 이름과 주소: 아래 메인 메뉴 (LINKS 창에도 자동으로 반영)
    • 사진과 환영 문구: 아래 콘텐츠 template
    • 색상과 글꼴: index.css 상단
    • 창 제목, 크기, 위치, 등장 순서: index.js의 WINDOW_CONFIGS
  -->

  <!-- 1. 페이지 타이틀과 메인 메뉴 -->
  <header class="page-header">
    <h1 class="page-title">Jonghyeok_Hong.exe</h1>
    <h1 class="page-subtitle">Personal Homepage</h1>
  </header>

  <!-- 메뉴 항목을 추가하면 등장 순서가 자동으로 적용됩니다. -->
  <nav class="main-menu" aria-label="메인 메뉴">
    <a href="profile/profile.html" class="menu-item"><span class="label">PROFILE</span></a>
    <a href="blog/blog1.html" class="menu-item"><span class="label">BLOG</span></a>
    <a href="project/projects.html" class="menu-item"><span class="label">PROJECTS</span></a>
    <a href="photo/photo1.html" class="menu-item"><span class="label">PHOTO</span></a>
  </nav>

  <!-- 2. 각 창에 표시할 콘텐츠 -->
  <template id="photo-secondary-content">
    <figure class="window-photo">
      <img class="window-image" src="images/100_1792 Copy.JPG" alt="샘플 이미지" />
      <!-- 사진 설명을 넣으려면 아래 figcaption 안에 입력하세요. -->
      <figcaption class="window-caption"></figcaption>
    </figure>
    <p class="window-description"></p>
  </template>

  <template id="welcome-content">
    <p class="welcome-message">Welcome to My Page!!!</p>
  </template>

  <template id="photo-primary-content">
    <img class="window-image" src="images/100_1786 Copy.JPG" alt="샘플" />
  </template>

  <template id="links-content">
    <ul class="window-links" data-menu-links></ul>
  </template>

  <!-- 3. 공통 창 구조: 모든 창이 이 틀을 공유합니다. -->
  <template id="window-template">
    <section class="win98 draggable" role="dialog">
      <div class="win98__titlebar" data-handle>
        <div class="win98__title" data-title></div>
        <div class="win98__controls">
          <button type="button" class="btn-98" title="Minimize" aria-label="Minimize" data-minimize>
            <svg class="ico" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1" y="6" width="8" height="1.6" fill="#5b3d84" />
            </svg>
          </button>
          <button type="button" class="btn-98" title="Maximize" aria-label="Maximize" data-maximize>
            <svg class="ico" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="#5b3d84" stroke-width="1.4" />
            </svg>
          </button>
          <button type="button" class="btn-98" title="Close" aria-label="Close" data-close>
            <svg class="ico" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 2 L8 8 M8 2 L2 8" stroke="#5b3d84" stroke-width="1.6" stroke-linecap="square" />
            </svg>
          </button>
        </div>
      </div>
      <div class="win98__body" data-content></div>
    </section>
  </template>
</body>
</html>
